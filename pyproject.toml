[project]
name = "pangloss"
version = "0.1.0"
description = "Modelling, REST API and database bindings for Graph databases"

[tool.uv.workspace]
members = [
    "packages/*",
]
# a separate repository, cloned here to work on; Pangloss depends on it through git
exclude = ["packages/pydantic-meta-kit"]

[tool.pytest.ini_options]
testpaths = ["packages"]
norecursedirs = ["pydantic-meta-kit"]
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
target-version = "py315"

[dependency-groups]
dev = [
    "coverage>=7.14",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.90",
]

# Static types: the models are generated at run time (`Person.Create`, `Person.get`, `_meta`, ...), which a
# type checker cannot see. In the code that makes or uses them, and in tests and the demo, which declare
# models inside functions, the rules that report only that are turned off; everywhere else they are on.
[[tool.ty.overrides]]
include = [
    "packages/*/tests/**",
    "pangloss-demo/**",
    "sdk-demo/**",
]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-await = "ignore"
invalid-argument-type = "ignore"
unknown-argument = "ignore"
missing-argument = "ignore"
pydantic-discarded-extra-argument = "ignore"
invalid-type-form = "ignore"
invalid-method-override = "ignore"
invalid-attribute-override = "ignore"
invalid-assignment = "ignore"
unused-type-ignore-comment = "ignore"
truthiness-test-of-callable = "ignore"
unsupported-base = "ignore"
unresolved-import = "ignore"  # (the test modules import each other by name)

[[tool.ty.overrides]]
include = [
    "packages/pangloss-models/src/pangloss_models/initialise_models/**",
    "packages/pangloss-models/src/pangloss_models/model_bases/**",
    "packages/pangloss-models/src/pangloss_models/export.py",
    "packages/pangloss-models/src/pangloss_models/migrations/check.py",
    "packages/pangloss-api/src/pangloss_api/routes/models.py",
    "packages/pangloss-sdk/src/**",
    "packages/pangloss-memgraph/src/pangloss_memgraph/databases/memgraph/build_*_query.py",
    "packages/pangloss-memgraph/src/pangloss_memgraph/databases/memgraph/exposed_functions.py",
]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-attribute-access = "ignore"
invalid-attribute-override = "ignore"
invalid-mutable-override = "ignore"
invalid-type-form = "ignore"
invalid-type-arguments = "ignore"
invalid-return-type = "ignore"
invalid-assignment = "ignore"
no-matching-overload = "ignore"
unknown-argument = "ignore"
missing-argument = "ignore"
empty-body = "ignore"
pydantic-discarded-extra-argument = "ignore"
unused-type-ignore-comment = "ignore"

# dulwich's types are strict about object ids and refs (bytes are accepted at run time)
[[tool.ty.overrides]]
include = [
    "packages/pangloss-sdk-server/src/pangloss_sdk_server/gitrepo.py",
    "packages/pangloss-sdk-server/src/pangloss_sdk_server/git_endpoint.py",
]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"

# Line coverage: `uv run coverage run -m pytest packages && uv run coverage report`
[tool.coverage.run]
source_pkgs = ["pangloss_models"]
branch = false

[tool.coverage.report]
fail_under = 94
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
