[project]
name = "pangloss"
version = "0.1.0"
description = "Modelling, REST API and database bindings for Graph databases"

[tool.uv.workspace]
members = [
    "packages/*",
]
# a separate repository, cloned here to work on; Pangloss depends on it through git
exclude = ["packages/pydantic-meta-kit"]

[tool.pytest.ini_options]
testpaths = ["packages"]
norecursedirs = ["pydantic-meta-kit"]
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
target-version = "py315"
# (the stubs of the packages' own models are generated, `python -m pangloss_testing.framework_stubs`: formatting them
# moves their `type: ignore` comments, and they import what the module does, used or not)
extend-exclude = ["packages/*/src/**/*.pyi"]

# (`run_tests.sh` checks pyflakes and bugbear: `ruff check --select F,B`. Typer's parameters are
# made in the defaults by design)
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[dependency-groups]
dev = [
    "coverage>=7.14",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.90",
]
# End-to-end tests in a browser (`uv run pytest e2e`; needs `uv run playwright install chromium`)
e2e = [
    "pytest-playwright>=0.7",
]

# Static types: the models are generated at run time (`Person.Create`, `Person.get`, `_meta`, ...), which a
# type checker cannot see. In the code that makes or uses them, and in tests and the demo, which declare
# models inside functions, the rules that report only that are turned off; everywhere else they are on.
[[tool.ty.overrides]]
include = [
    "packages/*/tests/**",
    "e2e/**",
    "packages/pangloss-testing/src/pangloss_testing/conformance/**",
    "pangloss-demo/**",
    "sdk-demo/**",
    # (the scripts of the smoke test; its app, `pangloss-smoketest/smoke`, is checked as a project's own code is)
    "pangloss-smoketest/smoke_scripts/**",
]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-await = "ignore"
invalid-argument-type = "ignore"
unknown-argument = "ignore"
missing-argument = "ignore"
pydantic-discarded-extra-argument = "ignore"
invalid-type-form = "ignore"
invalid-method-override = "ignore"
invalid-attribute-override = "ignore"
invalid-assignment = "ignore"
unused-type-ignore-comment = "ignore"
unused-ignore-comment = "ignore"
truthiness-test-of-callable = "ignore"
unsupported-base = "ignore"
unresolved-import = "ignore"  # (the test modules import each other by name)

[[tool.ty.overrides]]
include = [
    "packages/pangloss-models/src/pangloss_models/initialise_models/**",
    "packages/pangloss-models/src/pangloss_models/model_bases/**",
    "packages/pangloss-models/src/pangloss_models/export.py",
    "packages/pangloss-models/src/pangloss_models/migrations/check.py",
    "packages/pangloss-api/src/pangloss_api/routes/models.py",
    "packages/pangloss-sdk/src/**",
    "packages/pangloss-cypher/src/pangloss_cypher/build_*_query.py",
    "packages/pangloss-cypher/src/pangloss_cypher/write_plan.py",
    "packages/pangloss-cypher/src/pangloss_cypher/write_functions.py",
    "packages/pangloss-memgraph/src/pangloss_memgraph/databases/memgraph/exposed_functions.py",
    "packages/pangloss-zotero/src/pangloss_zotero/store.py",
    "packages/pangloss-zotero/src/pangloss_zotero/link.py",
    "packages/pangloss-calendar/src/pangloss_calendar/graph.py",
    "packages/pangloss-typology/src/pangloss_typology/typology.py",
    "packages/pangloss-typology/src/pangloss_typology/service.py",
]
[tool.ty.overrides.rules]
invalid-await = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-attribute-access = "ignore"
invalid-attribute-override = "ignore"
invalid-mutable-override = "ignore"
invalid-type-form = "ignore"
invalid-type-arguments = "ignore"
invalid-return-type = "ignore"
invalid-assignment = "ignore"
no-matching-overload = "ignore"
unknown-argument = "ignore"
missing-argument = "ignore"
empty-body = "ignore"
pydantic-discarded-extra-argument = "ignore"
unused-type-ignore-comment = "ignore"
unused-ignore-comment = "ignore"

# the date families override the type of a field with the member of the family that has the calendar (and the dateable
# traits narrow `date` to the kinds they take)
[[tool.ty.overrides]]
include = [
    "packages/pangloss-dates/src/pangloss_dates/julian.py*",
    "packages/pangloss-dates/src/pangloss_dates/gregorian.py*",
    "packages/pangloss-dates/src/pangloss_dates/dateable.py*",
]
[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"

# the stubs of the packages' own models (`python -m pangloss_testing.framework_stubs`) and of the smoke test project
# (`pangloss make-stubs`) are written for any checker: they carry `type: ignore` comments that ty does not need
[[tool.ty.overrides]]
include = ["packages/*/src/**/*.pyi", "pangloss-smoketest/smoke/*.pyi"]
[tool.ty.overrides.rules]
unused-type-ignore-comment = "ignore"

# the scripts of the smoke test call the drivers (neo4j, Playwright) more loosely than their types allow
[[tool.ty.overrides]]
include = ["pangloss-smoketest/smoke_scripts/**"]
[tool.ty.overrides.rules]
no-matching-overload = "ignore"

# dulwich's types are strict about object ids and refs (bytes are accepted at run time)
[[tool.ty.overrides]]
include = [
    "packages/pangloss-sdk-server/src/pangloss_sdk_server/gitrepo.py",
    "packages/pangloss-sdk-server/src/pangloss_sdk_server/git_endpoint.py",
]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"

# Line coverage: `uv run coverage run -m pytest packages && uv run coverage report`. The gate (`fail_under`) is for
# `pangloss_models` only. `--source` on the command line does not override `source_pkgs`: to measure another package,
# give a file of its own with `--rcfile` (`[run] source_pkgs = pangloss_memgraph, pangloss_core`)
[tool.coverage.run]
source_pkgs = ["pangloss_models"]
branch = false

[tool.coverage.report]
fail_under = 94
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
