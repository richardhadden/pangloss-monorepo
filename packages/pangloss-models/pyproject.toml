[project]
name = "pangloss-models"
version = "0.1.0"
description = "Pangloss models: declare research data as Python classes, and generate their create, update and view models"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "richard.hadden@oeaw.ac.at" }
]
requires-python = ">=3.15"
dependencies = [
    "frozendict>=2.4.7",
    "pangloss-core",
    "pydantic>=2.13.3",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
pangloss-core = { workspace = true }
pangloss-sdk = { workspace = true }

[dependency-groups]
dev = [
    "dirty-equals>=0.11",
    "pangloss-sdk",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "python-lsp-server>=1.14.0",
]
