[project]
name = "pangloss-admin"
version = "0.1.0"
description = "Optional admin page for Pangloss, and long-running jobs that installed apps declare"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "pangloss-api",
    "pangloss-core",
    "pangloss-models",
    "pangloss-users",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-api = { workspace = true }
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-users = { workspace = true }
