[project]
name = "pangloss-users"
version = "0.1.0"
description = "Users, passwords and personal access tokens for Pangloss"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "pangloss-core",
    "pydantic[email]>=2.13.4",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-core = { workspace = true }
