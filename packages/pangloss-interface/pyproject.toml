[project]
name = "pangloss-interface"
version = "0.1.0"
description = "The Pangloss web interface: a Solid 2.0 application, its component library, and the commands and endpoints it needs"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "pangloss-core",
    "pangloss-models",
    "typer>=0.12",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The JavaScript is part of the package, without what npm installs and builds
source-exclude = ["**/node_modules/**", "**/dist/**", "**/.env", "**/*.tsbuildinfo"]
wheel-exclude = ["**/node_modules/**", "**/dist/**", "**/.env", "**/*.tsbuildinfo"]

[tool.uv.sources]
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-api = { workspace = true }
pangloss-cli = { workspace = true }

[dependency-groups]
dev = [
    "pangloss-api",
    "pangloss-cli",
    "httpx2>=2.15",
]
