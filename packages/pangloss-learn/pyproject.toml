[project]
name = "pangloss-learn"
version = "0.1.0"
description = "Fitting a weighted model from people's decisions for Pangloss: a logistic regression in numpy, with no database in it"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.2",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
