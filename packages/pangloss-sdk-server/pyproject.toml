[project]
name = "pangloss-sdk-server"
version = "0.1.0"
description = "Optional: builds a project's SDK (its models, as a package) and serves it"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "a2wsgi>=1.10.10",
    "dulwich>=1.2.19",
    "fastapi>=0.115",
    "pangloss-api",
    "pangloss-core",
    "pangloss-models",
    "pangloss-sdk",
    "pangloss-users",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-api = { workspace = true }
pangloss-users = { workspace = true }
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-sdk = { workspace = true }
pangloss-cli = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.15",
    "pangloss-cli",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
