[project]
name = "pangloss-library"
version = "0.1.0"
description = "Ready-made models for Pangloss: alternatives weighted by how likely each is, their percentages kept to 100"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "annotated-types>=0.7",
    "pangloss-derived",
    "pangloss-interface",
    "pangloss-models",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-derived = { workspace = true }
pangloss-interface = { workspace = true }
pangloss-models = { workspace = true }
