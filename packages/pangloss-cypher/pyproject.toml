[project]
name = "pangloss-cypher"
version = "0.1.0"
description = "What the Cypher backends of Pangloss (Memgraph, Neo4j) share: the storage format, and the queries that are the same on both"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "neo4j>=6.2.0",
    "pangloss-core",
    "pangloss-models",
    "pangloss-users",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-users = { workspace = true }
