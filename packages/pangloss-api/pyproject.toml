[project]
name = "pangloss-api"
version = "0.1.0"
description = "The Pangloss REST API"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "pangloss-core",
    "pangloss-models",
    "pangloss-users",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "watchfiles>=0.21",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-users = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.15",
]
