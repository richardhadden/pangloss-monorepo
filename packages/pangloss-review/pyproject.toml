[project]
name = "pangloss-review"
version = "0.1.0"
description = "Optional review for Pangloss: documents are checked by another user before they are published, with comments"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "pangloss-api",
    "pangloss-core",
    "pangloss-models",
    "pangloss-users",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-api = { workspace = true }
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-memgraph = { workspace = true }
pangloss-users = { workspace = true }

[dependency-groups]
dev = [
    "pangloss-memgraph",
    "pytest-asyncio>=1.4.0",
]
