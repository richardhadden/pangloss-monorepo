[project]
name = "pangloss-zotero"
version = "0.1.0"
description = "Optional Zotero for Pangloss: keeps a Zotero library in the database, one way (from Zotero), as entities that can be sources and subjects"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.15",
    "pangloss-api",
    "pangloss-core",
    "pangloss-models",
    "pangloss-users",
    "typer>=0.12",
    "websockets>=15",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-api = { workspace = true }
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-memgraph = { workspace = true }
pangloss-neo4j = { workspace = true }
pangloss-testing = { workspace = true }
pangloss-users = { workspace = true }

[dependency-groups]
dev = [
    "pangloss-memgraph",
    "pangloss-neo4j",
    "pangloss-testing",
    "pytest-asyncio>=1.4.0",
]
