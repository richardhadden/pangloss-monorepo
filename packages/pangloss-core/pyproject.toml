[project]
name = "pangloss-core"
version = "0.1.0"
description = "Pangloss settings and the pieces shared by every Pangloss package"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic-settings>=2.14.1",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
