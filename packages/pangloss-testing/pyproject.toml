[project]
name = "pangloss-testing"
version = "0.1.0"
description = "Fixtures for tests that need a live Pangloss database, on whichever backend is under test"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "docker>=7.1.0",
    "neo4j>=6.2.0",
    "pangloss-core",
    "pangloss-models",
    "pangloss-users",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "tenacity>=9.1.4",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
pangloss-users = { workspace = true }
