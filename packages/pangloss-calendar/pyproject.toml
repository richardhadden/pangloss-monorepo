[project]
name = "pangloss-calendar"
version = "0.1.0"
description = "Optional calendar for Pangloss: days, months, years and feasts in the Julian or Gregorian calendar, and what is dated on them"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "pangloss-api",
    "pangloss-dates",
    "pangloss-memgraph",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-dates = { workspace = true }
pangloss-api = { workspace = true }
pangloss-memgraph = { workspace = true }

[dependency-groups]
dev = ["juliandate>=1.0.5"]
