[project]
name = "pangloss-sdk"
version = "0.1.0"
description = "Use a Pangloss project's models from outside it, as requests to its API (client, login, errors)"
readme = "README.md"
authors = [
    { name = "Richard Hadden", email = "rwjhadden@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pangloss-core",
    "pangloss-models",
    "httpx2>=2.15",
]

[project.scripts]
pangloss-sdk = "pangloss_sdk.cli:main"

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.urls]
Repository = "https://github.com/richardhadden/pangloss-monorepo"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pangloss-core = { workspace = true }
pangloss-models = { workspace = true }
